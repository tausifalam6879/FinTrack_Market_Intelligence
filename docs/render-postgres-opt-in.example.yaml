# OPT-IN EXAMPLE ONLY. Copy the relevant values into Render after deliberately
# selecting a managed PostgreSQL provider/plan. Never commit the real URL.
services:
  - type: web
    name: fintrack-market-intelligence-api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-market-db
          property: connectionString
      - key: REQUIRE_DURABLE_DATABASE
        value: "true"
      - key: DATABASE_BACKUP_POLICY
        value: provider-pitr-plus-verified-logical-export

# Add this section to the active Blueprint only after choosing a plan and region.
# The plan is intentionally not hard-coded here because provisioning can create
# a billable resource and available plan names can change.
databases:
  - name: fintrack-market-db
    databaseName: fintrack
    user: fintrack
    # plan: <explicitly-selected-render-postgres-plan>
    # region: <same-region-as-api>
