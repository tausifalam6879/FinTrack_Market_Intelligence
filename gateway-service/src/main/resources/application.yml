server:
  port: ${PORT:8081}
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: fintrack-market-gateway
  codec:
    max-in-memory-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: FinTrack Market Gateway
    architecture: Spring Boot public API boundary
    authentication: not-required
    personal-data-storage: none

fintrack:
  gateway:
    upstream-base-url: ${FINTRACK_GATEWAY_UPSTREAM_BASE_URL:http://127.0.0.1:8002}
    request-timeout: ${FINTRACK_GATEWAY_REQUEST_TIMEOUT:75s}
    readiness-timeout: ${FINTRACK_GATEWAY_READINESS_TIMEOUT:4s}
    failure-threshold: ${FINTRACK_GATEWAY_FAILURE_THRESHOLD:3}
    open-duration: ${FINTRACK_GATEWAY_OPEN_DURATION:20s}
    max-body-bytes: 65536
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://tausifalam6879.github.io
