name: FinTrack CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fintrack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fintrack_ci
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack -d fintrack_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            market-service/requirements.txt
            market-service/requirements-runtime.txt
            market-service/requirements-training.txt

      - name: Install training and test dependencies
        working-directory: market-service
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile backend modules
        working-directory: market-service
        run: python -m compileall -q .

      - name: Run backend test suite
        working-directory: market-service
        env:
          GIT_PYTHON_REFRESH: quiet
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Verify PostgreSQL schema and readiness
        working-directory: market-service
        env:
          DATABASE_URL: postgresql://fintrack:fintrack_ci_password@127.0.0.1:5432/fintrack_ci
          REQUIRE_DURABLE_DATABASE: "true"
          MODEL_ARTIFACT_DIR: ${{ runner.temp }}/fintrack-artifacts
        run: |
          python -c "from runtime_health import initialize_runtime, readiness_report; initialize_runtime(); report=readiness_report(); database=report['checks']['database']; assert report['status']=='ready', report; assert database['backend']=='postgresql', report; assert database['schemaVersion']==database['expectedSchemaVersion']==4, report; assert database['durableAcrossDeploys'] is True, report; assert database['durabilityRequired'] is True, report"
          python database_maintenance.py status

      - name: Verify SQLite-to-PostgreSQL cutover with real PostgreSQL
        working-directory: market-service
        env:
          DATABASE_URL: postgresql://fintrack:fintrack_ci_password@127.0.0.1:5432/fintrack_ci
          SOURCE_DATABASE_URL: sqlite:///${{ runner.temp }}/fintrack-cutover-source.db
        run: |
          python -c "import os; from persistence import Database; source=Database(os.environ['SOURCE_DATABASE_URL']); source.initialize_schema(); source.upsert_company({'symbol':'INFY.NS','name':'Infosys Limited','source':'ci'}); source.upsert_market_bars([{'symbol':'INFY.NS','session_date':'2026-08-12','open':1500.0,'high':1520.0,'low':1490.0,'close':1512.0,'adjusted_close':1512.0,'volume':1000000,'source':'ci','ingested_at':'2026-08-13T00:00:00+00:00'}])"
          python database_maintenance.py migrate --confirm-empty-target --manifest-path "${{ runner.temp }}/fintrack-cutover-manifest.json"
          python -c "import json; from pathlib import Path; report=json.loads(Path('${{ runner.temp }}/fintrack-cutover-manifest.json').read_text()); assert report['status']=='verified', report; assert report['targetBackend']=='postgresql', report; assert report['tablesVerified']==10, report; assert report['totalRows']==2, report; assert report['credentialsIncluded'] is False, report"

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_MARKET_API_BASE_URL: https://fintrack-market-intelligence-api.onrender.com
        run: npm run build

  gateway-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: gateway-service/pom.xml

      - name: Test Spring Boot public gateway
        working-directory: gateway-service
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify

  api-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-tests, frontend-build, gateway-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build lightweight API image
        run: docker build --file market-service/Dockerfile --tag fintrack-api:ci market-service

      - name: Build Spring Boot gateway image
        run: docker build --file gateway-service/Dockerfile --tag fintrack-gateway:ci gateway-service

      - name: Verify non-root container and readiness endpoint
        shell: bash
        run: |
          set -euo pipefail
          network_name="fintrack-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          api_name="fintrack-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker network create "$network_name" >/dev/null
          api_id=$(docker run --detach --name "$api_name" --network "$network_name" --publish 127.0.0.1:8002:8000 fintrack-api:ci)
          gateway_id=""
          cleanup() {
            if [ -n "$gateway_id" ]; then
              docker logs "$gateway_id" || true
              docker rm --force "$gateway_id" >/dev/null || true
            fi
            docker logs "$api_id" || true
            docker rm --force "$api_id" >/dev/null || true
            docker network rm "$network_name" >/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8002/health/ready > readiness.json; then
              break
            fi
            sleep 2
          done
          curl --fail --show-error http://127.0.0.1:8002/health/live
          python -c "import json; report=json.load(open('readiness.json')); assert report['status']=='ready'; assert report['checks']['database']['status']=='ready'"
          test "$(docker inspect --format '{{.Config.User}}' "$api_id")" = "fintrack"

          gateway_id=$(docker run --detach --network "$network_name" --publish 127.0.0.1:8081:8080 --env "FINTRACK_GATEWAY_UPSTREAM_BASE_URL=http://${api_name}:8000" fintrack-gateway:ci)
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/health/ready > gateway-readiness.json; then
              break
            fi
            sleep 2
          done
          python -c "import json; report=json.load(open('gateway-readiness.json')); assert report['status']=='ready'; assert report['upstream']=='ready'; assert report['personalDataStored'] is False"
          curl --fail --silent --dump-header gateway-headers.txt "http://127.0.0.1:8081/market/model-status?symbol=RELIANCE.NS" > gateway-model-status.json
          grep --ignore-case --quiet '^X-FinTrack-Gateway: spring-boot' gateway-headers.txt
          test "$(curl --silent --output invalid-gateway-response.json --write-out '%{http_code}' 'http://127.0.0.1:8081/market/analysis?symbol=https://attacker.example/file')" = "400"
          python -c "import json; report=json.load(open('invalid-gateway-response.json')); assert report['code']=='invalid_symbol'"
          test "$(docker inspect --format '{{.Config.User}}' "$gateway_id")" = "fintrack"
