services:
  - type: web
    name: fintrack-market-intelligence-api
    runtime: docker
    dockerfilePath: ./market-service/Dockerfile
    dockerContext: ./market-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_TIMEOUT_MS
        value: "12000"
      - key: MARKET_OVERVIEW_CACHE_TTL_SECONDS
        value: "900"

