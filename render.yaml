services:
  - type: web
    name: fintrack-market-intelligence-api
    runtime: docker
    dockerfilePath: ./market-service/Dockerfile
    dockerContext: ./market-service
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: render
      # Keep false until DATABASE_URL points to managed PostgreSQL; then set true.
      - key: REQUIRE_DURABLE_DATABASE
        value: "false"
      - key: DATABASE_BACKUP_POLICY
        value: not_configured
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_TIMEOUT_MS
        value: "25000"
      - key: MARKET_OVERVIEW_CACHE_TTL_SECONDS
        value: "900"

  - type: web
    name: fintrack-market-gateway
    runtime: docker
    dockerfilePath: ./gateway-service/Dockerfile
    dockerContext: ./gateway-service
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: FINTRACK_GATEWAY_UPSTREAM_BASE_URL
        value: https://fintrack-market-intelligence-api.onrender.com
      - key: FINTRACK_GATEWAY_REQUEST_TIMEOUT
        value: 90s
      - key: FINTRACK_GATEWAY_FAILURE_THRESHOLD
        value: "3"
      - key: FINTRACK_GATEWAY_OPEN_DURATION
        value: 20s
