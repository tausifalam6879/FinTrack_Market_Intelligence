name: fintrack-market-intelligence

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mlflow:
    build:
      context: ./market-service
      dockerfile: Dockerfile.mlflow
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  api:
    build:
      context: ./market-service
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-compose-local}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-local}
      DATABASE_URL: postgresql://fintrack:${POSTGRES_PASSWORD:-fintrack_local_only}@postgres:5432/fintrack
      REQUIRE_DURABLE_DATABASE: "true"
      MODEL_ARTIFACT_DIR: /app/artifacts
      DATABASE_BACKUP_POLICY: ${DATABASE_BACKUP_POLICY:-local-development}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: fintrack-market-models
      LLM_PROVIDER: ${LLM_PROVIDER:-hybrid}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-8000}
      GEMINI_CIRCUIT_COOLDOWN_SECONDS: ${GEMINI_CIRCUIT_COOLDOWN_SECONDS:-10}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-45000}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-60}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-FinTrack Market Intelligence local@example.com}
    ports:
      - "127.0.0.1:${API_PORT:-8002}:8000"
    volumes:
      - api_data:/app/data
      - model_artifacts:/app/artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      FINTRACK_GATEWAY_UPSTREAM_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_data:
  api_data:
  model_artifacts:
